<header
  class="page-head is-flex is-justify-content-space-between is-flex-wrap-wrap is-align-items-flex-end mb-4"
>
  <div>
    <h2 class="title is-4 mb-1">Abrechnung</h2>
    <p class="subtitle is-6 mb-0">Trainerstunden und Fahrten zum Wettkampftraining</p>
  </div>
</header>

<section class="box">
  <app-tabs [tabs]="tabs()" [(active)]="tab" />
  @switch (tab()) {
    @case ('statements') {
      <app-billing-statements />
    }
    @case ('drives') {
      <app-billing-drives />
    }
    @case ('all-statements') {
      <app-billing-all-statements />
    }
    @case ('all-drives') {
      <app-billing-all-drives />
    }
    @case ('rates') {
      <app-billing-rates />
    }
  }
</section>
