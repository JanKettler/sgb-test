<header
  class="page-head is-flex is-justify-content-space-between is-flex-wrap-wrap is-align-items-flex-end mb-4"
>
  <div>
    <h2 class="title is-4 mb-1">Weihnachtsmarkt</h2>
    <p class="subtitle is-6 mb-0">{{ dates() }}</p>
  </div>
</header>

<app-tabs [tabs]="tabs()" [active]="tab()" (activeChange)="pick($event)" />
@switch (tab()) {
  @case ('notice') {
    <app-market-notice />
  }
  @case ('cash') {
    <app-market-cash />
  }
  @case ('settlement') {
    <app-market-settlement />
  }
  @case ('stock') {
    <app-market-stock />
  }
  @case ('recipe') {
    <app-market-recipe />
  }
  @case ('setup') {
    <app-market-setup />
  }
}
