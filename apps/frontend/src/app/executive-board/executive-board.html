<header
  class="page-head is-flex is-justify-content-space-between is-flex-wrap-wrap is-align-items-flex-end mb-4"
>
  <div>
    <h2 class="title is-4 mb-1">Vorstand</h2>
    <p class="subtitle is-6 mb-0">Anträge, Sitzungen mit Protokoll, Beschlüsse und Fristen</p>
  </div>
</header>

<section class="box">
  <app-tabs [tabs]="tabs()" [(active)]="tab" />
  @switch (tab()) {
    @case ('motions') {
      <app-board-motions />
    }
    @case ('meetings') {
      <app-board-meetings />
    }
    @case ('resolutions') {
      <app-board-resolutions />
    }
    @case ('deadlines') {
      <app-board-deadlines />
    }
  }
</section>
