<app-modal-dialog [heading]="heading()" (closed)="closed.emit()">
  <label class="label" for="name-input">{{ label() }}</label>
  <input id="name-input" class="input" type="text" [value]="value()" (input)="setValue($event)" />
  <ng-container dialogActions>
    @if (deletable()) {
      <app-action kind="delete" withText (pressed)="deleted.emit()" />
    }
    <app-action kind="cancel" withText (pressed)="closed.emit()" />
    <app-action kind="save" withText (pressed)="saved.emit(value())" />
  </ng-container>
</app-modal-dialog>
