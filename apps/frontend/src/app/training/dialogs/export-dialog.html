<app-modal-dialog heading="Excel-Liste" accent="green" [wide]="true" (closed)="closed.emit()">
  <div class="form-grid">
    <div>
      <label class="label" for="export-group">Gruppe</label>
      <div class="select is-fullwidth">
        <select id="export-group" (change)="setGroup($event)">
          @for (group of store.viewableGroups(); track group.id) {
            <option [value]="group.id" [selected]="group.id === currentGroup()">
              {{ group.name }}
            </option>
          }
        </select>
      </div>
    </div>
    <div>
      <label class="label" for="export-content">Inhalt</label>
      <div class="select is-fullwidth">
        <select id="export-content" (change)="setContent($event)">
          <option value="blank" [selected]="content() === 'blank'">Leer (zum Ausfüllen)</option>
          <option value="filled" [selected]="content() === 'filled'">Mit Anwesenheit</option>
        </select>
      </div>
    </div>
    <div>
      <label class="label" for="export-from">Von</label>
      <app-date-field inputId="export-from" [(value)]="from" />
    </div>
    <div>
      <label class="label" for="export-to">Bis</label>
      <app-date-field inputId="export-to" [(value)]="to" />
    </div>
  </div>
  <div class="is-flex is-flex-wrap-wrap is-align-items-center is-gap-2">
    <button type="button" class="chip is-solid" (click)="thisMonthRange()">Dieser Monat</button>
    <button type="button" class="chip is-solid" (click)="lastThreeMonths()">Letzte 3 Monate</button>
    <button type="button" class="chip is-solid" (click)="season()">Saison</button>
  </div>
  <ng-container dialogActions>
    <button type="button" class="button" (click)="closed.emit()">Abbrechen</button>
    <button type="button" class="button is-success" (click)="download()">Excel erstellen</button>
  </ng-container>
</app-modal-dialog>
