<app-modal-dialog
  heading="Abmelden"
  accent="amber"
  [subtitle]="subtitle()"
  (closed)="closed.emit()"
>
  <div class="reasons">
    @for (reason of store.reasons(); track reason) {
      <button
        type="button"
        class="reason"
        [class.is-selected]="reason === other && otherSelected()"
        (click)="choose(reason)"
      >
        {{ reason }}
      </button>
    }
  </div>
  @if (otherSelected()) {
    <label class="label mt-4" for="decline-note">Bemerkung (optional)</label>
    <input
      id="decline-note"
      class="input"
      type="text"
      placeholder="z. B. Arzttermin"
      [value]="note()"
      (input)="setNote($event)"
    />
  }
  <ng-container dialogActions>
    @if (otherSelected()) {
      <app-action kind="back" withText (pressed)="otherSelected.set(false)" />
      <app-action
        kind="unregister"
        withText
        (pressed)="chosen.emit({ reason: other, note: note() })"
      />
    } @else {
      <app-action kind="cancel" withText (pressed)="closed.emit()" />
    }
  </ng-container>
</app-modal-dialog>
