<header
  class="page-head is-flex is-justify-content-space-between is-flex-wrap-wrap is-align-items-flex-end mb-4"
>
  <div>
    <h2 class="title is-4 mb-1">Jugend</h2>
    <p class="subtitle is-6 mb-0">Schwimmabzeichen und Jugendkasse</p>
  </div>
</header>

<section class="box">
  <app-tabs [tabs]="tabs()" [(active)]="tab" />
  @switch (tab()) {
    @case ('badges') {
      <app-youth-badges />
    }
    @case ('summary') {
      <app-youth-summary />
    }
    @case ('prices') {
      <app-youth-prices />
    }
    @case ('entries') {
      <app-youth-entries />
    }
    @case ('expenses') {
      <app-youth-expenses />
    }
    @case ('close') {
      <app-youth-close />
    }
  }
</section>
