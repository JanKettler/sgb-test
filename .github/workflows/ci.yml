name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://sgb_portal:ci_test_password@127.0.0.1:5432/sgb_portal
      MAIL_ENABLED: 'true'
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      MAIL_FROM: sgb-portal@example.invalid
    services:
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: sgb_portal
          POSTGRES_USER: sgb_portal
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgb_portal -d sgb_portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Check pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run commitlint -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Check latest push commit message
        if: github.event_name == 'push'
        run: git log -1 --format=%B | npm run commitlint -- --verbose

      - name: Check formatting, linting, tests, and builds
        run: npm run check

      - name: Apply migrations to the CI database
        run: npm run prisma:migrate:deploy

      - name: Verify waitlist database constraints
        run: npm run db:verify:waitlist --workspace=apps/backend

      - name: Verify local SMTP receipt delivery
        run: npm run mail:verify --workspace=apps/backend
