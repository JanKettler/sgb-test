name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for the repository subpath
        run: npm run build --workspace=apps/frontend -- --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Add SPA fallback for deep links
        run: cp apps/frontend/dist/frontend/browser/index.html apps/frontend/dist/frontend/browser/404.html

      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist/frontend/browser

  deploy:
    name: Publish preview
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
