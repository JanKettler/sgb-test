name: debug-prettier
on:
  push:
    branches: [debug/prettier-r9]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts
      - run: npx prettier --version
      - run: npx prettier --write apps/frontend/src docs
      - run: git diff --no-color
